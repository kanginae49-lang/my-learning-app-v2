<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우리 아이 학습 기록</title>
<meta name="theme-color" content="#2f6f5e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="학습기록">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ctext y=%27.9em%27 font-size=%2790%27%3E📚%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#f7f5ef;--card:#fff;--tx:#222;--mu:#777;--bd:#e5e1d6;--a:#3b82c4;--b:#f08a3c;--g:#4a9d6e;--ac:#2f6f5e;--ac2:#e3f1ec;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1c1a;--card:#262826;--tx:#eee;--mu:#9a9a94;--bd:#3a3c38;--a:#6aa8e0;--b:#f2a366;--g:#6cc08e;--ac:#6cc3a8;--ac2:#27403a;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
.w{max-width:640px;margin:0 auto;padding:12px}
h1{font-size:18px;margin:4px 0 10px}h3{margin:0 0 8px;font-size:15px}
button{font:inherit;color:inherit;cursor:pointer}
.kids,.tabs{display:flex;gap:6px;margin-bottom:8px}
.kids button,.tabs button{flex:1;padding:8px 4px;border:1px solid var(--bd);background:var(--card);border-radius:10px}
.kids button.on{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700}
.tabs button.on{background:var(--ac2);border-color:var(--ac);color:var(--ac);font-weight:700}
.kids .ed{flex:0 0 40px}.tabs button{font-size:13px;white-space:nowrap;padding:8px 2px}
.nav{display:flex;align-items:center;justify-content:space-between;margin:8px 0}
.nav button{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:4px 14px}
.nav b{font-size:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}.row label{flex:1;min-width:90px;font-size:12px;color:var(--mu)}
input[type=number],input[type=text],select,textarea{width:100%;margin-top:2px;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:60px;margin-top:8px;resize:vertical}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{border:1px solid var(--bd);border-radius:16px;padding:3px 10px;font-size:13px;background:var(--card)}.chip.sel{background:var(--ac2);border-color:var(--ac);color:var(--ac);font-weight:700}.bkr{align-items:center;margin-top:8px;font-size:13px}.bkr span{flex:2;min-width:100px}.bkr2{border:1px dashed var(--bd);border-radius:10px;padding:8px;margin-top:8px}.lg2{border-bottom:1px solid var(--bd);padding:6px 0}.ln{white-space:pre-wrap;font-size:13px;margin:4px 0}.chip .tp{width:58px;margin:0 0 0 4px;padding:3px 6px;display:inline-block}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{text-align:center;font-size:12px;color:var(--mu)}
.cal button{aspect-ratio:1;border:1px solid var(--bd);background:var(--bg);border-radius:8px;position:relative;padding:0}
.cal button.rec{background:var(--ac2);border-color:var(--ac);font-weight:700}
.cal button.rec::after{content:"";position:absolute;bottom:4px;left:50%;margin-left:-3px;width:6px;height:6px;border-radius:50%;background:var(--ac)}
.cal button.td{outline:2px solid var(--b)}
.cal i{visibility:hidden}
.sum{display:flex;gap:6px}.sum div{flex:1;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px;text-align:center}
.sum small{display:block;color:var(--mu);font-size:11px}.sum b{font-size:15px}
.pr{margin:10px 0}.ph{display:flex;justify-content:space-between;font-size:13px}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--bd);margin:4px 0}
.lg{display:flex;justify-content:space-between;font-size:12px}
.cols{display:flex;gap:2px}.cl{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center}
.zone{height:110px;width:100%;display:flex;align-items:flex-end}
.stk{width:100%;display:flex;flex-direction:column;border-radius:3px 3px 0 0;overflow:hidden}.stk u{display:block}
.cl small{font-size:10px;color:var(--mu)}
.lgd{font-size:12px;margin-top:6px;display:flex;gap:12px}
.tr{display:flex;align-items:center;gap:8px;font-size:13px;margin:4px 0}.tr span{width:62px}.tr .bar{flex:1;margin:0}.tr em{width:92px;text-align:right;font-style:normal}
table{width:100%;border-collapse:collapse;font-size:12px;text-align:center}td,th{padding:5px 2px;border-bottom:1px solid var(--bd)}
.wk{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between;font-size:13px;padding:4px 0;border-bottom:1px solid var(--bd)}
.mu{color:var(--mu);font-size:12px}
</style></head><body><div class="w">
<h1>📚 우리 아이 학습 기록</h1>
<div class="kids" id="kids"></div>
<div class="tabs" id="tabs"></div>
<div class="nav"><button onclick="sh(-1)">◀</button><b id="ttl"></b><button onclick="sh(1)">▶</button></div>
<div id="main"></div>
<p class="mu">기록은 이 기기의 브라우저에 저장됩니다(다른 기기와 자동 동기화되지 않아요).</p>
<div class="card"><button class="chip" onclick="bk1()">💾 백업(내보내기)</button> <button class="chip" onclick="bk2()">📥 복원(가져오기)</button><textarea id="bkt" style="display:none"></textarea><button class="chip sel" id="bkb" style="display:none;margin-top:6px" onclick="bk3()">복원 적용</button></div>
</div>
<script>
const CATS=[['h','흘려듣기'],['j','집중듣기'],['k','한글책읽기'],['e','영어책읽기'],['m','수학'],['o','기타']];
const KT=['그림책','문학책','지식책'],ET=['그림책','리더스북','챕터북','소설','지식책'];
const TABS=['달력','일간','주간','월간','연간','읽는중'];
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const P=s=>{const[a,b,c]=s.split('-');return new Date(+a,b-1,+c)};
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addD=(s,n)=>{const d=P(s);d.setDate(d.getDate()+n);return ymd(d)};
const mon=s=>addD(s,-((P(s).getDay()+6)%7));
const mDates=(y,m)=>{const n=new Date(y,m+1,0).getDate();return Array.from({length:n},(_,i)=>ymd(new Date(y,m,i+1)))};
const fmt=m=>{m=Math.round(m);return m>=60?Math.floor(m/60)+'시간'+(m%60?' '+m%60+'분':''):m+'분'};
let D={names:['첫째','둘째'],r:[{},{}],memo:[{},{}]};
try{const x=localStorage.getItem('kidlog');if(x)D=JSON.parse(x)}catch(e){}
D.books=D.books||[[],[]];
const save=()=>{try{localStorage.setItem('kidlog',JSON.stringify(D))}catch(e){}};
const BK=()=>D.books[kid];
let kid=0,tab=0,d=ymd(new Date());const today=d;
const rec=s=>D.r[kid][s]||{};
const M=()=>D.memo[kid];
const hasRec=s=>{const r=rec(s);return CATS.some(([k])=>{const x=r[k]||{};return nz(x.t)||nz(x.c)||nz(x.p)||nz(x.n)||(x.ty&&x.ty.length)||(x.bk&&x.bk.length)||(x.log&&x.log.length)})||nz(M()['d:'+s])||BK().some(b=>b.done&&b.doneDate==s)};
const nz=z=>{const q=String(z==null?'':z).trim();return q!==''&&q!=='0'};
const bsv=(x,f)=>(x.bk||[]).reduce((a,i)=>a+(+(((x.bs||{})[i]||{})[f])||0),0)+(x.log||[]).reduce((a,e)=>a+(+e[f]||0),0);
function S(ds){const s={A:0,B:0,kc:0,kp:0,ec:0,ep:0,kt:{},et:{}};
 ds.forEach(x=>{const r=rec(x);BK().forEach(b=>{if(b.done&&b.doneDate==x){if(b.lang=='k')s.kc++;else s.ec++}});
  CATS.forEach(([k])=>{const v=(+(r[k]||{}).t||0)+bsv(r[k]||{},'t');'hje'.includes(k)?s.A+=v:s.B+=v});
  s.kc+=(+(r.k||{}).c||0)+bsv(r.k||{},'c');s.kp+=(+(r.k||{}).p||0)+bsv(r.k||{},'p');s.ec+=(+(r.e||{}).c||0)+bsv(r.e||{},'c');s.ep+=(+(r.e||{}).p||0)+bsv(r.e||{},'p');
  const sp=(x,o)=>{const ty=x.ty||[],tp=x.tp||{},p=+x.p||0;if(ty.some(t=>+tp[t]>0))ty.forEach(t=>o[t]=(o[t]||0)+(+tp[t]||0));else ty.forEach(t=>o[t]=(o[t]||0)+p/ty.length);(x.bk||[]).forEach(i=>{const b=(x.bs||{})[i]||{};if(b.ty&&+b.p>0)o[b.ty]=(o[b.ty]||0)+ +b.p});(x.log||[]).forEach(e=>{if(e.ty&&+e.p>0)o[e.ty]=(o[e.ty]||0)+ +e.p})};sp(r.k||{},s.kt);sp(r.e||{},s.et)});
 s.T=s.A+s.B;return s}
const timeCards=s=>`<div class="sum"><div><small style="color:var(--a)">흘듣·집듣·영어책</small><b>${fmt(s.A)}</b></div><div><small style="color:var(--b)">한글책·수학·기타</small><b>${fmt(s.B)}</b></div><div><small>전체</small><b>${fmt(s.T)}</b></div></div>`;
const pr=(l,a,b)=>{const t=a+b,p=t?Math.round(a/t*100):0;return `<div class="pr"><div class="ph"><span>${l} (한글 : 영어)</span><b>${t?a+' : '+b:'-'}</b></div><div class="bar"><i style="width:${p}%;background:var(--g)"></i><i style="width:${t?100-p:0}%;background:var(--a)"></i></div><div class="lg"><span style="color:var(--g)">■ 한글 ${p}%</span><span style="color:var(--a)">■ 영어 ${t?100-p:0}%</span></div></div>`};
const bookCards=s=>`<div class="card"><h3>한글책 · 영어책</h3>${pr('권수',s.kc,s.ec)}${pr('쪽수',s.kp,s.ep)}</div>`;
const typeRows=(t,types,c,col)=>{const sum=types.reduce((a,x)=>a+(c[x]||0),0);return `<div class="card"><h3>${t} 항목별 비율 <span class="mu">(쪽수 기준)</span></h3>${types.map(x=>{const v=c[x]||0,p=sum?Math.round(v/sum*100):0;return `<div class="tr"><span>${x}</span><div class="bar"><i style="width:${p}%;background:${col}"></i></div><em>${p}% · ${Math.round(v)}쪽</em></div>`}).join('')}<p class="mu">항목별로 입력한 쪽수 기준입니다. (항목별 쪽수를 입력하지 않은 기록은 체크한 항목에 균등하게 나눠 계산)</p></div>`};
const cols=it=>{const mx=Math.max(1,...it.map(x=>x.A+x.B));return `<div class="card"><div class="cols">${it.map(x=>`<div class="cl" title="${x.l}: ${fmt(x.A+x.B)}"><div class="zone"><div class="stk" style="height:${(x.A+x.B)/mx*100}%"><u style="flex:${x.B};background:var(--b)"></u><u style="flex:${x.A};background:var(--a)"></u></div></div><small>${x.l}</small></div>`).join('')}</div><div class="lgd"><span style="color:var(--a)">■ 흘듣·집듣·영어책</span><span style="color:var(--b)">■ 한글책·수학·기타</span></div></div>`};
const memoBox=(key,t)=>`<div class="card"><h3>📝 ${t} 메모</h3><textarea data-memo="${key}" placeholder="메모">${esc(M()[key]||'')}</textarea></div>`;

function calView(){const y=P(d).getFullYear(),m=P(d).getMonth(),f=new Date(y,m,1).getDay();
 let h='<div class="card"><div class="cal">'+'일월화수목금토'.split('').map(x=>`<div class="h">${x}</div>`).join('');
 for(let i=0;i<f;i++)h+='<i></i>';
 mDates(y,m).forEach((s,i)=>{h+=`<button class="${hasRec(s)?'rec':''} ${s==today?'td':''}" onclick="go('${s}')">${i+1}</button>`});
 const n=mDates(y,m).filter(hasRec).length;
 return h+`</div><p class="mu">● 기록한 날: ${n}일 · 날짜를 누르면 일간 기록으로 이동</p></div>`}
function dayStats(){const s=S([d]);return timeCards(s)+bookCards(s)}
function dayView(){const r=rec(d);
 let h=`<div id="dst">${dayStats()}</div><div style="height:10px"></div>`;
 CATS.forEach(([k,n])=>{const x=r[k]||{},bk=k=='k'||k=='e';if(bk){h+=logBox3(k,n,x);return}
  h+=`<div class="card"><h3>${n}</h3><div class="row"><label>${bk?'시간(분·책장 외)':'시간(분)'}<input type="number" min="0" data-k="${k}" data-f="t" value="${x.t??''}"></label>`+
  (bk?`<label>권수(책장 외)<input type="number" min="0" data-k="${k}" data-f="c" value="${x.c??''}"></label><label>총 쪽수(책장 외)<input type="number" min="0" data-k="${k}" data-f="p" value="${x.p??''}"></label>`:'')+'</div>'+
  (bk?'<div class="chips">'+(k=='k'?KT:ET).map(t=>`<label class="chip"><input type="checkbox" data-k="${k}" data-ty="${t}" ${(x.ty||[]).includes(t)?'checked':''}> ${t} <input type="number" min="0" class="tp" placeholder="쪽" data-k="${k}" data-tp="${t}" value="${(x.tp||{})[t]??''}"></label>`).join('')+'</div>':'')+
  (bk?readBox(k,x):'')+`<textarea data-k="${k}" data-f="n" placeholder="내용 기록">${esc(x.n||'')}</textarea></div>`});
 return h+memoBox('d:'+d,'일간')}
function weekView(){const m=mon(d),ds=Array.from({length:7},(_,i)=>addD(m,i)),s=S(ds);
 return timeCards(s)+'<div style="height:10px"></div>'+cols(ds.map(x=>{const q=S([x]);return{l:'월화수목금토일'[(P(x).getDay()+6)%7]+' '+P(x).getDate(),A:q.A,B:q.B}}))+bookCards(s)+memoBox('w:'+m,'주간')}
function monthView(){const y=P(d).getFullYear(),mo=P(d).getMonth(),ds=mDates(y,mo),s=S(ds);
 const wk={};ds.forEach(x=>(wk[mon(x)]=wk[mon(x)]||[]).push(x));
 return timeCards(s)+'<div style="height:10px"></div>'+cols(ds.map(x=>{const q=S([x]);return{l:P(x).getDate(),A:q.A,B:q.B}}))+
 `<div class="card"><h3>주간별 진행시간</h3>${Object.values(wk).map(w=>{const q=S(w);return `<div class="wk"><span>${P(w[0]).getMonth()+1}/${P(w[0]).getDate()}~${P(w[w.length-1]).getDate()}</span><span style="color:var(--a)">${fmt(q.A)}</span><span style="color:var(--b)">${fmt(q.B)}</span><b>${fmt(q.T)}</b></div>`}).join('')}</div>`+
 `<div class="card"><h3>월간 독서 통계</h3><table><tr><th></th><th>권수</th><th>쪽수</th></tr><tr><td>한글책</td><td>${s.kc}권</td><td>${s.kp}쪽</td></tr><tr><td>영어책</td><td>${s.ec}권</td><td>${s.ep}쪽</td></tr></table></div>`+
 bookCards(s)+typeRows('한글책',KT,s.kt,'var(--g)')+typeRows('영어책',ET,s.et,'var(--a)')+memoBox('m:'+y+'-'+(mo+1),'월간')}
function yearView(){const y=P(d).getFullYear(),ms=Array.from({length:12},(_,i)=>S(mDates(y,i))),s=S(ms.flatMap((_,i)=>mDates(y,i)));
 return timeCards(s)+'<div style="height:10px"></div>'+cols(ms.map((q,i)=>({l:(i+1)+'월',A:q.A,B:q.B})))+
 `<div class="card"><table><tr><th>월</th><th>듣기·영어</th><th>기타</th><th>전체</th><th>한글 권/쪽</th><th>영어 권/쪽</th></tr>${ms.map((q,i)=>`<tr><td>${i+1}월</td><td>${fmt(q.A)}</td><td>${fmt(q.B)}</td><td><b>${fmt(q.T)}</b></td><td>${q.kc}/${q.kp}</td><td>${q.ec}/${q.ep}</td></tr>`).join('')}<tr><td><b>합계</b></td><td>${fmt(s.A)}</td><td>${fmt(s.B)}</td><td><b>${fmt(s.T)}</b></td><td>${s.kc}/${s.kp}</td><td>${s.ec}/${s.ep}</td></tr></table></div>`+
 bookCards(s)+typeRows('한글책',KT,s.kt,'var(--g)')+typeRows('영어책',ET,s.et,'var(--a)')+memoBox('y:'+y,'연간')}
let ed=null,pre=null;
function logBox(k,n,x){const L=x.log||[],e=ed&&ed.k==k?L.find(z=>z.id==ed.id):null,v=e||{},TY=k=='k'?KT:ET,bs=BK().filter(b=>b.lang==k&&(!b.done||b.id==v.bk)),sel=v.bk||(pre&&pre.lang==k?pre.id:'');
 const f=(a,l,val)=>`<label>${l}<input type="number" min="0" id="${k}_${a}" value="${val??''}"></label>`;
 const sm=f=>L.reduce((a,z)=>a+(+z[f]||0),0);return `<div class="card"><h3>${n}</h3><div class="sum" style="margin-bottom:8px"><div><small>총 시간</small><b>${fmt(sm('t'))}</b></div><div><small>총 쪽수</small><b>${sm('p')}쪽</b></div><div><small>기록</small><b>${L.length}건</b></div></div>`+
 (L.length?L.map(z=>`<div class="lg2"><div><b>${esc(z.title||'(제목 없음)')}</b> <span class="mu">${[z.t?fmt(+z.t):'',z.p?z.p+'쪽':'',z.c?z.c+'권':'',z.ty||'',z.fin?'✅완독':''].filter(Boolean).join(' · ')}</span></div>${z.n?`<div class="ln">${esc(z.n)}</div>`:''}<div>${z.fin?'':`<button class="chip" onclick="logEdit('${k}',${z.id})">수정</button>`} <button class="chip" onclick="logDel('${k}',${z.id})">삭제</button></div></div>`).join(''):'<p class="mu">아직 기록이 없어요</p>')+
 `<div class="bkr2"><b>${e?'✏️ 기록 수정':'➕ 기록 추가'}</b><div class="row" style="margin-top:6px"><label>책<select id="${k}_bk"><option value="">읽는 중 아닌 책 (직접 입력)</option>${bs.map(b=>`<option value="${b.id}" ${b.id==sel?'selected':''}>${esc(b.title)}</option>`).join('')}</select></label><label>제목(직접 입력)<input type="text" id="${k}_ti" value="${esc(v.bk?'':(v.title||''))}"></label></div><div class="row" style="margin-top:6px">${f('t','시간(분)',v.t)}${f('p','쪽수',v.p)}<label>항목<select id="${k}_ty"><option value="">선택</option>${TY.map(t=>`<option ${v.ty==t?'selected':''}>${t}</option>`).join('')}</select></label></div><div class="row" style="margin-top:6px">${f('c','권수(직접 입력 시)',v.c)}${f('lp','마지막 읽은 쪽(읽는 중 책)',v.lp)}</div><textarea id="${k}_n" placeholder="내용 기록">${esc(v.n||'')}</textarea><div style="margin-top:8px"><button class="chip sel" style="padding:6px 16px" onclick="logSave('${k}')">${e?'수정 저장':'기록 추가'}</button> ${e?`<button class="chip" onclick="ed=null;render()">취소</button>`:''}</div></div></div>`}
function undoFin(e){const b=BK().find(z=>z.id==e.bk);if(b&&b.doneDate==d){b.done=false;b.doneDate=null}}
function logSave(k){const g=a=>$(k+'_'+a),bid=g('bk').value,b=bid?BK().find(z=>z.id==bid):null,title=b?b.title:g('ti').value.trim();
 if(!title&&!g('t').value&&!g('p').value&&!g('n').value.trim())return;
 const r=D.r[kid][d]=D.r[kid][d]||{};r[k]=r[k]||{};const L=r[k].log=r[k].log||[];
